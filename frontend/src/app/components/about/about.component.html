           text-indigo-400 drop-shadow-md mb-4">
    Core Features
  </h2>

    <div class="grid md:grid-cols-2 lg:grid-cols-2 gap-8">
      <div *ngFor="let feature of appInfo.features"
           class="bg-slate-800 p-6 rounded-2xl shadow-lg hover:scale-105 transition duration-300 hover:shadow-indigo-500/30">

        <h3 class="text-xl font-semibold text-indigo-400 mb-3">
          {{ feature.title }}
        </h3>

        <p class="text-slate-300 text-sm leading-relaxed">
          {{ feature.description }}
        </p>
      </div>
    </div>
