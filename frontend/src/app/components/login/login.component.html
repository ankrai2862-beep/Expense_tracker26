<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-md w-96">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">{{ isRegistering ? 'Create Account' : 'Welcome Back' }}</h2>
    
    <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-4" *ngIf="isRegistering">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="fullName">Full Name</label>
        <input [(ngModel)]="fullName" name="fullName" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="fullName" type="text" placeholder="John Doe">
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Email</label>
        <input [(ngModel)]="email" name="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="email" type="email" placeholder="email@example.com">
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
        <input [(ngModel)]="password" name="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="password" type="password" placeholder="******************">
      </div>

      <div class="flex items-center justify-between">
        <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full" type="submit">
          {{ isRegistering ? 'Sign Up' : 'Sign In' }}
        </button>
      </div>
      
      <div class="mt-4 text-center">
        <a class="text-blue-500 hover:text-blue-800 text-sm cursor-pointer" (click)="toggleMode()">
            {{ isRegistering ? 'Already have an account? Login' : 'Need an account? Register' }}
        </a>
      </div>
    </form>
  </div>
</div>
